name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp mintwaterfall-example.html _site/index.html
          cp mintwaterfall-example.html _site/mintwaterfall-example.html
          cp dist/mintwaterfall.min.js dist/mintwaterfall.umd.js dist/mintwaterfall.esm.js _site/dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
