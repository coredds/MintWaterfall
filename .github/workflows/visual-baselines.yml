name: Update visual baselines

# Regenerates the Linux screenshot baselines (e2e/__screenshots__/linux) and commits them.
# Run manually after an intended visual change, then review the diff in the commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Regenerate screenshots
        run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update Linux visual baselines"
            git push
          fi
