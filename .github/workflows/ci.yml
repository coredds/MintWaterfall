name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows re-running CI on the current main, e.g. after the baseline bot commits
  # (pushes made with GITHUB_TOKEN don't trigger workflows).
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - run: npm run lint

      - name: Formatting (Prettier)
        if: matrix.node-version == '22.x'
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:size

      - name: Package check (types, ESM, CJS from a packed tarball)
        if: matrix.node-version == '22.x'
        run: npm run check:package

      - name: API reference builds (TypeDoc, warnings are errors)
        if: matrix.node-version == '22.x'
        run: npm run docs:api

      - name: Test
        run: npm test

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Functional browser tests always run. Screenshot tests skip until Linux baselines
      # exist — create them with the "Update visual baselines" workflow.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
